<path d="M 421 52 L 421 58 L 421 58 L 421 64" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 64 L 414 57 L 428 57 Z" fill="#44546A"/>
<path d="M 421 110 L 421 116 L 421 116 L 421 122" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 122 L 414 115 L 428 115 Z" fill="#44546A"/>
<path d="M 421 168 L 421 174 L 421 174 L 421 180" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 180 L 414 173 L 428 173 Z" fill="#44546A"/>
<path d="M 421 226 L 421 232 L 421 232 L 421 238" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 238 L 414 231 L 428 231 Z" fill="#44546A"/>
<path d="M 421 284 L 421 290 L 421 290 L 421 296" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 296 L 414 289 L 428 289 Z" fill="#44546A"/>
<path d="M 421 342 L 421 348 L 421 348 L 421 354" fill="none" stroke="#44546A" stroke-width="1.5"/>
<path d="M 421 354 L 414 347 L 428 347 Z" fill="#44546A"/>
<rect x="111" y="6" width="620" height="46" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
<text x="125" y="23.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333333">1. 多源采集</text>
<text x="125" y="45" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#333333">collector、cleaner、normalizer、quality 四段管线，产出 NormalizedRecord</text>
<rect x="111" y="64" width="620" height="46" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
<text x="125" y="81.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1F2328">2. 记忆编排</text>
<text x="125" y="103" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#1F2328">Orchestrator 做敏感过滤与记忆分类，写入短期记忆</text>
<rect x="111" y="122" width="620" height="46" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
<text x="125" y="139.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333333">3. 偏好抽取</text>
<text x="125" y="161" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#333333">抽取键值偏好形成 MemoryEntry，并做版本管理与冲突消解</text>
<rect x="111" y="180" width="620" height="46" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
<text x="125" y="197.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1F2328">4. 记忆长期化</text>
<text x="125" y="219" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#1F2328">短期到中期看热度，中期到长期看质量，经 entry_adapter 落库</text>
<rect x="111" y="238" width="620" height="46" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
<text x="125" y="255.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333333">5. 记忆库</text>
<text x="125" y="277" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#333333">memory_policy 评分后向量化，对外提供增删改查</text>
<rect x="111" y="296" width="620" height="46" fill="#FFFFFF" stroke="#44546A" stroke-width="1.5"/>
<text x="125" y="313.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1F2328">6. 安全层</text>
<text x="125" y="335" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#1F2328">写入前调用 filter_sensitive，遗忘时解析指令并级联删除</text>
<rect x="111" y="354" width="620" height="46" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
<text x="125" y="371.88" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#333333">7. 检索</text>
<text x="125" y="393" text-anchor="start" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" fill="#333333">recall 走向量召回，返回长期记忆条目与相似度分数</text>
</svg>